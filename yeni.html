<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kader İplikleri</title>
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d12'/%3E%3Cpath d='M6 8c8 0 12 16 20 16M6 24c8 0 12-16 20-16' stroke='%23d02c42' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff8a9a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Manrope:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --ink: #ece5d9;
      --fevzi: #86b6cc;
      --buket: #dcae80;
      --thread: #d02c42;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(circle at 50% 42%, rgba(208, 44, 66, 0.14), transparent 52%),
        var(--bg);
      color: var(--ink);
    }
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .mark {
      position: fixed;
      left: 50%;
      top: 46%;
      width: min(42vw, 280px);
      transform: translate(-50%, -50%);
      overflow: visible;
    }
    .strand { fill: none; stroke-width: 1.6; stroke-linecap: round; opacity: 0.85; }
    .strand.f { stroke: var(--fevzi); }
    .strand.b { stroke: var(--buket); }
    .dot { fill: var(--thread); }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <svg class="mark" viewBox="0 0 120 60" aria-hidden="true">
    <path class="strand f" d="M4 12 C 44 12, 76 48, 116 48" />
    <path class="strand b" d="M4 48 C 44 48, 76 12, 116 12" />
    <circle class="dot" cx="60" cy="30" r="3.2" />
  </svg>
</body>
</html>
